<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Panel - নির্ঝর লাইব্রেরী</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            margin: 0;

            padding: 20px;

            background: #f4f6f8;

        }


        h1 {

            text-align: center;

            margin-bottom: 5px;

        }


        .admin-badge {

            text-align: center;

            color: white;

            background: #007bff;

            display: table;

            margin: 0 auto 25px;

            padding: 6px 15px;

            border-radius: 20px;

            font-size: 13px;

        }


        .dashboard {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 15px;

            margin-bottom: 25px;

        }


        .dashboard-card {

            background: white;

            padding: 20px;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);

        }


        .dashboard-card h3 {

            margin: 0 0 10px;

            color: #555;

            font-size: 16px;

        }


        .dashboard-card p {

            margin: 0;

            font-size: 25px;

            font-weight: bold;

            color: #007bff;

        }


        .form-box {

            background: white;

            padding: 20px;

            border-radius: 12px;

            max-width: 800px;

            margin: auto;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);

        }


        .form-box h2 {

            margin-top: 0;

        }


        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 5px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

        }


        input[readonly] {

            background: #eee;

        }


        button {

            border: none;

            border-radius: 6px;

            padding: 10px 15px;

            cursor: pointer;

            font-size: 15px;

        }


        .save-btn {

            width: 100%;

            margin-top: 20px;

            background: #007bff;

            color: white;

        }


        .save-btn:hover {

            background: #0056b3;

        }


        .cancel-btn {

            width: 100%;

            margin-top: 10px;

            background: #777;

            color: white;

            display: none;

        }


        .preview {

            margin-top: 10px;

            text-align: center;

        }


        .preview img {

            max-width: 200px;

            max-height: 200px;

            border-radius: 8px;

        }


        .search-box {

            max-width: 800px;

            margin: 30px auto 20px;

        }


        .products {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 20px;

        }


        .product-card {

            background: white;

            padding: 15px;

            border-radius: 12px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);

        }


        .product-card img {

            width: 100%;

            height: 200px;

            object-fit: contain;

            background: #f5f5f5;

            border-radius: 8px;

        }


        .product-card h3 {

            margin-bottom: 8px;

        }


        .product-card p {

            margin: 7px 0;

        }


        .product-id {

            color: #666;

            font-size: 14px;

        }


        .price {

            color: green;

            font-size: 20px;

            font-weight: bold;

        }


        .card-buttons {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;

            margin-top: 12px;

        }


        .edit-btn {

            background: #ffc107;

            color: #000;

        }


        .delete-btn {

            background: #dc3545;

            color: white;

        }


        .qr-btn {

            background: #198754;

            color: white;

            width: 100%;

            margin-top: 8px;

        }


        .qr-box {

            display: none;

            margin-top: 15px;

            padding: 15px;

            background: #f8f9fa;

            border-radius: 8px;

            text-align: center;

        }


        .qr-box canvas {

            max-width: 100%;

        }


        .qr-link {

            font-size: 12px;

            word-break: break-all;

            color: #555;

            margin-top: 10px;

        }


        .download-qr {

            margin-top: 10px;

            background: #0d6efd;

            color: white;

        }


        @media(max-width:600px) {

            body {
                padding: 10px;
            }

        }

    </style>

</head>


<body>


    <h1>নির্ঝর লাইব্রেরী</h1>

    <div class="admin-badge">
        ADMIN PANEL
    </div>


    <!-- =====================================
         Dashboard
    ====================================== -->

    <div class="dashboard">

        <div class="dashboard-card">

            <h3>
                মোট পণ্য
            </h3>

            <p id="totalProducts">
                0
            </p>

        </div>


        <div class="dashboard-card">

            <h3>
                মোট স্টক
            </h3>

            <p id="totalStock">
                0
            </p>

        </div>


        <div class="dashboard-card">

            <h3>
                স্টকের মোট ক্রয়মূল্য
            </h3>

            <p id="totalPurchaseValue">
                ৳0
            </p>

        </div>

    </div>



    <!-- =====================================
         Product Form
    ====================================== -->

    <div class="form-box">

        <h2 id="formTitle">
            Product Management System
        </h2>


        <label>
            Product ID
        </label>

        <input
            type="text"
            id="productId"
            placeholder="যেমন: NL-0001"
        >


        <label>
            পণ্যের নাম
        </label>

        <input
            type="text"
            id="productName"
            placeholder="যেমন: Math Notebook"
        >


        <label>
            পণ্যের ছবি
        </label>

        <input
            type="file"
            id="productImage"
            accept="image/*"
        >


        <div
            class="preview"
            id="imagePreview"
        ></div>


        <label>
            ক্রয়মূল্য (প্রতি পিস)
        </label>

        <input
            type="number"
            id="purchasePrice"
            min="0"
            placeholder="শুধু Admin দেখতে পারবে"
        >


        <label>
            MRP
        </label>

        <input
            type="number"
            id="mrp"
            min="0"
            placeholder="যেমন: 70"
        >


        <label>
            Discount
        </label>

        <input
            type="number"
            id="discount"
            min="0"
            placeholder="যেমন: 10"
        >


        <label>
            Selling Price
        </label>

        <input
            type="number"
            id="sellingPrice"
            readonly
        >


        <label>
            Stock
        </label>

        <input
            type="number"
            id="stock"
            min="0"
            placeholder="যেমন: 20"
        >


        <button
            class="save-btn"
            id="saveButton"
            onclick="saveProduct()"
        >
            পণ্য সংরক্ষণ করুন
        </button>


        <button
            class="cancel-btn"
            id="cancelButton"
            onclick="cancelEdit()"
        >
            Edit বাতিল করুন
        </button>


    </div>



    <!-- =====================================
         Search
    ====================================== -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="পণ্যের নাম বা Product ID দিয়ে খুঁজুন..."
            oninput="displayProducts()"
        >

    </div>



    <!-- =====================================
         Products
    ====================================== -->

    <div
        id="products"
        class="products"
    ></div>



    <!-- =====================================
         Firebase + QR Code
    ====================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>


    <script type="module">


        // =====================================
        // Firebase Import
        // =====================================

        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            setDoc,
            deleteDoc
        }
        from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



        // =====================================
        // Firebase Configuration
        // =====================================

        const firebaseConfig = {

            apiKey:
                "AIzaSyCY7V8_MgILkg4yAauiqzKZ3Uo3w_o_B4",

            authDomain:
                "nirjhor-library.firebaseapp.com",

            projectId:
                "nirjhor-library",

            storageBucket:
                "nirjhor-library.firebasestorage.app",

            messagingSenderId:
                "771313980493",

            appId:
                "1:771313980493:web:ff76cbd83d88e102fd7804",

            measurementId:
                "G-213SK9BK75"

        };



        // Firebase চালু

        const app =
            initializeApp(firebaseConfig);


        const db =
            getFirestore(app);



        // =====================================
        // Variables
        // =====================================

        let products = [];

        let editingIndex = -1;

        let selectedImage = "";



        // =====================================
        // HTML Elements
        // =====================================

        const productId =
            document.getElementById("productId");

        const productName =
            document.getElementById("productName");

        const productImage =
            document.getElementById("productImage");

        const imagePreview =
            document.getElementById("imagePreview");

        const purchasePrice =
            document.getElementById("purchasePrice");

        const mrp =
            document.getElementById("mrp");

        const discount =
            document.getElementById("discount");

        const sellingPrice =
            document.getElementById("sellingPrice");

        const stock =
            document.getElementById("stock");

        const productsDiv =
            document.getElementById("products");

        const searchInput =
            document.getElementById("searchInput");



        // =====================================
        // Selling Price Calculation
        // =====================================

        function calculateSellingPrice() {

            const m =
                Number(mrp.value) || 0;

            const d =
                Number(discount.value) || 0;


            if (d > m) {

                sellingPrice.value = 0;

                return;

            }


            sellingPrice.value =
                m - d;

        }


        mrp.addEventListener(
            "input",
            calculateSellingPrice
        );


        discount.addEventListener(
            "input",
            calculateSellingPrice
        );



        // =====================================
        // Image Compression
        // =====================================

        productImage.addEventListener(
            "change",
            function () {


                const file =
                    this.files[0];


                if (!file) {

                    return;

                }


                const reader =
                    new FileReader();


                reader.onload =
                    function (event) {


                        const img =
                            new Image();


                        img.onload =
                            function () {


                                const canvas =
                                    document.createElement(
                                        "canvas"
                                    );


                                let width =
                                    img.width;

                                let height =
                                    img.height;


                                const maxSize =
                                    800;


                                if (
                                    width > maxSize ||
                                    height > maxSize
                                ) {


                                    if (
                                        width > height
                                    ) {

                                        height =
                                            Math.round(
                                                height *
                                                maxSize /
                                                width
                                            );

                                        width =
                                            maxSize;

                                    }

                                    else {

                                        width =
                                            Math.round(
                                                width *
                                                maxSize /
                                                height
                                            );

                                        height =
                                            maxSize;

                                    }

                                }


                                canvas.width =
                                    width;

                                canvas.height =
                                    height;


                                const ctx =
                                    canvas.getContext(
                                        "2d"
                                    );


                                ctx.drawImage(
                                    img,
                                    0,
                                    0,
                                    width,
                                    height
                                );


                                let quality =
                                    0.8;

                                let result;


                                do {

                                    result =
                                        canvas.toDataURL(
                                            "image/jpeg",
                                            quality
                                        );

                                    quality -=
                                        0.05;

                                }

                                while (
                                    result.length >
                                    900000 &&
                                    quality >
                                    0.2
                                );


                                if (
                                    result.length >
                                    1000000
                                ) {

                                    alert(
                                        "ছবিটি অনেক বড়। ছোট ছবি ব্যবহার করুন।"
                                    );

                                    selectedImage =
                                        "";

                                    return;

                                }


                                selectedImage =
                                    result;


                                imagePreview.innerHTML =

                                    `
                                    <img
                                        src="${result}"
                                        alt="Preview"
                                    >
                                    `;

                            };


                        img.src =
                            event.target.result;

                    };


                reader.readAsDataURL(file);

            }
        );



        // =====================================
        // Load Products
        // =====================================

        async function loadProducts() {

            try {


                const snapshot =
                    await getDocs(
                        collection(
                            db,
                            "products"
                        )
                    );


                products = [];


                snapshot.forEach(
                    docSnapshot => {


                        products.push({

                            ...docSnapshot.data(),

                            firestoreId:
                                docSnapshot.id

                        });

                    }
                );


                displayProducts();

                updateDashboard();


            }

            catch (error) {

                console.error(error);

                alert(
                    "পণ্য লোড করতে সমস্যা হয়েছে।"
                );

            }

        }



        // =====================================
        // Dashboard
        // =====================================

        function updateDashboard() {


            document.getElementById(
                "totalProducts"
            ).innerText =
                products.length;


            let totalStock = 0;

            let totalPurchaseValue = 0;


            products.forEach(
                product => {


                    const s =
                        Number(
                            product.stock
                        ) || 0;


                    const p =
                        Number(
                            product.purchasePrice
                        ) || 0;


                    totalStock += s;

                    totalPurchaseValue +=
                        s * p;

                }
            );


            document.getElementById(
                "totalStock"
            ).innerText =
                totalStock;


            document.getElementById(
                "totalPurchaseValue"
            ).innerText =
                "৳" +
                totalPurchaseValue;

        }



        // =====================================
        // Display Products
        // =====================================

        function displayProducts() {


            productsDiv.innerHTML =
                "";


            const search =
                searchInput.value
                .trim()
                .toLowerCase();


            const filtered =
                products.filter(
                    product => {


                        const name =
                            String(
                                product.productName ||
                                ""
                            ).toLowerCase();


                        const id =
                            String(
                                product.productId ||
                                ""
                            ).toLowerCase();


                        return (
                            name.includes(search) ||
                            id.includes(search)
                        );

                    }
                );


            filtered.forEach(
                product => {


                    const realIndex =
                        products.indexOf(
                            product
                        );


                    createProductCard(
                        product,
                        realIndex
                    );

                }
            );

        }



        // =====================================
        // Product Card
        // =====================================

        function createProductCard(
            product,
            index
        ) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "product-card";


            let imageHTML =
                "";


            if (product.image) {

                imageHTML =

                    `
                    <img
                        src="${product.image}"
                        alt="${product.productName || ""}"
                    >
                    `;

            }

            else {

                imageHTML =

                    `
                    <div
                        style="
                            height:200px;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            background:#eee;
                            border-radius:8px;
                        "
                    >
                        ছবি নেই
                    </div>
                    `;

            }


            card.innerHTML =

                `

                ${imageHTML}


                <h3>

                    ${product.productName ||
                      "পণ্যের নাম নেই"}

                </h3>


                <p class="product-id">

                    Product ID:

                    <strong>
                        ${product.productId ||
                          product.firestoreId}
                    </strong>

                </p>


                <p>

                    ক্রয়মূল্য:

                    ৳${product.purchasePrice || 0}

                </p>


                <p>

                    MRP:

                    ৳${product.mrp || 0}

                </p>


                <p>

                    Discount:

                    ৳${product.discount || 0}

                </p>


                <p class="price">

                    Selling Price:

                    ৳${product.sellingPrice || 0}

                </p>


                <p>

                    Stock:

                    <strong>
                        ${product.stock || 0}
                    </strong>

                </p>


                <div class="card-buttons">


                    <button
                        class="edit-btn"
                        onclick="editProduct(${index})"
                    >

                        Edit

                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteProduct(${index})"
                    >

                        Delete

                    </button>


                </div>


                <button
                    class="qr-btn"
                    onclick="showQR(${index})"
                >

                    QR Code দেখুন

                </button>


                <div
                    id="qr-${index}"
                    class="qr-box"
                >

                </div>

                `;


            productsDiv.appendChild(
                card
            );

        }



        // =====================================
        // QR Code তৈরি
        // =====================================

        window.showQR =
            function(index) {


                const product =
                    products[index];


                const qrBox =
                    document.getElementById(
                        "qr-" + index
                    );


                if (
                    qrBox.style.display ===
                    "block"
                ) {

                    qrBox.style.display =
                        "none";

                    qrBox.innerHTML =
                        "";

                    return;

                }


                qrBox.style.display =
                    "block";


                qrBox.innerHTML =
                    "";


                const id =
                    product.productId ||
                    product.firestoreId;


                /*
                   বর্তমান ওয়েবসাইটের URL
                   থেকে product1.html-এর
                   URL তৈরি হবে।
                */

                const currentURL =
                    window.location.href;


                const baseURL =
                    currentURL.substring(
                        0,
                        currentURL.lastIndexOf("/") + 1
                    );


                const productURL =
                    baseURL +
                    "product1.html?id=" +
                    encodeURIComponent(id);


                // QR তৈরি

                new QRCode(
                    qrBox,
                    {
                        text: productURL,
                        width: 200,
                        height: 200
                    }
                );


                const link =
                    document.createElement(
                        "div"
                    );


                link.className =
                    "qr-link";


                link.innerText =
                    productURL;


                qrBox.appendChild(
                    link
                );


                const downloadButton =
                    document.createElement(
                        "button"
                    );


                downloadButton.className =
                    "download-qr";


                downloadButton.innerText =
                    "QR Code Download";


                downloadButton.onclick =
                    function() {


                        const canvas =
                            qrBox.querySelector(
                                "canvas"
                            );


                        if (!canvas) {

                            alert(
                                "QR তৈরি হয়নি।"
                            );

                            return;

                        }


                        const downloadLink =
                            document.createElement(
                                "a"
                            );


                        downloadLink.download =
                            id + "-QR.png";


                        downloadLink.href =
                            canvas.toDataURL(
                                "image/png"
                            );


                        downloadLink.click();

                    };


                qrBox.appendChild(
                    downloadButton
                );

            };



        // =====================================
        // Save Product
        // =====================================

        window.saveProduct =
            async function() {


                const id =
                    productId.value.trim();


                const name =
                    productName.value.trim();


                const purchase =
                    Number(
                        purchasePrice.value
                    );


                const m =
                    Number(
                        mrp.value
                    );


                const d =
                    Number(
                        discount.value
                    );


                const price =
                    Number(
                        sellingPrice.value
                    );


                const s =
                    Number(
                        stock.value
                    );


                // Validation

                if (!id) {

                    alert(
                        "Product ID দিন।"
                    );

                    return;

                }


                if (!name) {

                    alert(
                        "পণ্যের নাম দিন।"
                    );

                    return;

                }


                if (
                    isNaN(purchase) ||
                    purchase < 0
                ) {

                    alert(
                        "সঠিক ক্রয়মূল্য দিন।"
                    );

                    return;

                }


                if (
                    isNaN(m) ||
                    m < 0
                ) {

                    alert(
                        "সঠিক MRP দিন।"
                    );

                    return;

                }


                if (
                    isNaN(d) ||
                    d < 0
                ) {

                    alert(
                        "সঠিক Discount দিন।"
                    );

                    return;

                }


                if (d > m) {

                    alert(
                        "Discount MRP-এর চেয়ে বেশি হতে পারবে না।"
                    );

                    return;

                }


                if (
                    isNaN(s) ||
                    s < 0
                ) {

                    alert(
                        "সঠিক Stock দিন।"
                    );

                    return;

                }


                // নতুন পণ্যে ছবি বাধ্যতামূলক

                if (
                    editingIndex === -1 &&
                    !selectedImage
                ) {

                    alert(
                        "পণ্যের ছবি নির্বাচন করুন।"
                    );

                    return;

                }


                // Edit করলে পুরোনো ছবি থাকবে

                if (
                    editingIndex !== -1 &&
                    !selectedImage
                ) {

                    selectedImage =
                        products[
                            editingIndex
                        ].image || "";

                }


                const product = {

                    productId:
                        id,

                    productName:
                        name,

                    image:
                        selectedImage,

                    purchasePrice:
                        purchase,

                    mrp:
                        m,

                    discount:
                        d,

                    sellingPrice:
                        price,

                    stock:
                        s

                };


                try {


                    /*
                       Product ID-ই Firestore
                       Document ID হিসেবে ব্যবহার হবে।
                    */

                    await setDoc(

                        doc(
                            db,
                            "products",
                            id
                        ),

                        product

                    );


                    alert(
                        editingIndex === -1
                        ? "পণ্য সফলভাবে সংরক্ষণ হয়েছে।"
                        : "পণ্য সফলভাবে আপডেট হয়েছে।"
                    );


                    resetForm();


                    await loadProducts();


                }

                catch (error) {

                    console.error(error);

                    alert(
                        "পণ্য সংরক্ষণ করতে সমস্যা হয়েছে।"
                    );

                }

            };



        // =====================================
        // Edit Product
        // =====================================

        window.editProduct =
            function(index) {


                const product =
                    products[index];


                editingIndex =
                    index;


                productId.value =
                    product.productId ||
                    product.firestoreId;


                productName.value =
                    product.productName ||
                    "";


                purchasePrice.value =
                    product.purchasePrice ||
                    0;


                mrp.value =
                    product.mrp ||
                    0;


                discount.value =
                    product.discount ||
                    0;


                sellingPrice.value =
                    product.sellingPrice ||
                    0;


                stock.value =
                    product.stock ||
                    0;


                selectedImage =
                    product.image ||
                    "";


                if (product.image) {

                    imagePreview.innerHTML =

                        `
                        <img
                            src="${product.image}"
                            alt="Preview"
                        >
                        `;

                }

                else {

                    imagePreview.innerHTML =
                        "";

                }


                productId.disabled =
                    true;


                document.getElementById(
                    "saveButton"
                ).innerText =
                    "পণ্য আপডেট করুন";


                document.getElementById(
                    "cancelButton"
                ).style.display =
                    "block";


                window.scrollTo(
                    0,
                    0
                );

            };



        // =====================================
        // Delete Product
        // =====================================

        window.deleteProduct =
            async function(index) {


                const product =
                    products[index];


                const id =
                    product.productId ||
                    product.firestoreId;


                const confirmDelete =
                    confirm(
                        "আপনি কি এই পণ্যটি Delete করতে চান?"
                    );


                if (!confirmDelete) {

                    return;

                }


                try {


                    await deleteDoc(

                        doc(
                            db,
                            "products",
                            id
                        )

                    );


                    alert(
                        "পণ্য Delete হয়েছে।"
                    );


                    await loadProducts();


                }

                catch (error) {

                    console.error(error);

                    alert(
                        "পণ্য Delete করতে সমস্যা হয়েছে।"
                    );

                }

            };



        // =====================================
        // Cancel Edit
        // =====================================

        window.cancelEdit =
            function() {

                resetForm();

            };



        // =====================================
        // Reset Form
        // =====================================

        function resetForm() {


            editingIndex =
                -1;


            selectedImage =
                "";


            productId.value =
                "";

            productName.value =
                "";

            purchasePrice.value =
                "";

            mrp.value =
                "";

            discount.value =
                "";

            sellingPrice.value =
                "";

            stock.value =
                "";


            productId.disabled =
                false;


            productImage.value =
                "";


            imagePreview.innerHTML =
                "";


            document.getElementById(
                "saveButton"
            ).innerText =
                "পণ্য সংরক্ষণ করুন";


            document.getElementById(
                "cancelButton"
            ).style.display =
                "none";

        }



        // =====================================
        // প্রথমবার Product Load
        // =====================================

        loadProducts();


    </script>


</body>

</html>
