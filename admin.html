<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel - নির্ঝর লাইব্রেরী</title>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js" type="module"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
header{background:#174c32;color:white;padding:15px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:22px;margin:0}
h2{font-size:20px;color:#174c32}
button{border:0;border-radius:6px;padding:10px 13px;cursor:pointer;font-size:14px;margin:3px}
.primary{background:#176b43;color:white}
.secondary{background:#e5e7eb;color:#222}
.danger{background:#c62828;color:white}
.warning{background:#ffca28;color:#222}
.card{background:white;padding:16px;margin:15px 0;border-radius:10px;box-shadow:0 2px 8px #00000010}
.hidden{display:none!important}
input{width:100%;padding:10px;margin:5px 0 12px;border:1px solid #ccc;border-radius:5px;font-size:15px}
label{font-weight:bold;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}
.product{border:1px solid #ddd;padding:12px;border-radius:8px;overflow-wrap:anywhere}
.product img{width:100%;height:180px;object-fit:contain}
.stat{background:#e8f5e9;padding:15px;border-radius:8px}
.alert{border:1px solid #e5a000;background:#fff8df;padding:12px;border-radius:7px;margin:8px 0}
.alert.out{background:#ffebee;border-color:#d32f2f}
.close-notice{float:right;background:#ddd;color:#111;padding:4px 9px}
.small{font-size:13px;color:#555}
#qrReader{width:100%;max-width:450px;margin:auto}
#loginBox{max-width:400px;margin:40px auto}
@media(max-width:500px){body{padding:8px}header{align-items:flex-start}h1{font-size:19px}}
</style>
</head>

<body>
<header>
  <h1>নির্ঝর লাইব্রেরী</h1>
  <div>
    <button id="homeButton" class="secondary hidden" onclick="showSection('productsSection')">🏠 হোম</button>
    <button id="scannerButton" class="warning hidden" onclick="openScanner()">📷 QR Scanner</button>
    <button id="notificationButton" class="warning hidden" onclick="showAllLowStock()">🔔 <span id="lowCount">0</span></button>
    <button id="ordersButton" class="secondary hidden" onclick="showSection('ordersSection');loadOrders()">📦 অর্ডার</button>
    <button id="logoutButton" class="danger hidden" onclick="logout()">Logout</button>
  </div>
</header>

<section id="loginBox" class="card">
  <h2>Admin Login</h2>
  <label>পাসওয়ার্ড</label>
  <input type="password" id="adminPassword" placeholder="Admin password">
  <button class="primary" onclick="login()">লগইন</button>
  <p id="loginMessage"></p>
</section>

<main id="adminArea" class="hidden">
  <section id="stockNotice" class="card hidden">
    <h2>🔔 স্টক সতর্কতা</h2>
    <div id="stockNoticeList"></div>
  </section>

  <section id="scannerSection" class="card hidden">
    <h2>📷 QR Scanner</h2>
    <p>পণ্যের QR কোড ক্যামেরার সামনে ধরো। ক্যামেরা ব্যবহারের অনুমতি দিতে হবে।</p>
    <div id="qrReader"></div>
    <div id="scannerResult"></div>
    <button class="danger" onclick="closeScanner()">স্ক্যান বন্ধ করুন</button>
  </section>

  <section id="dashboard" class="grid">
    <div class="stat"><b>মোট পণ্য</b><h2 id="totalProducts">0</h2></div>
    <div class="stat"><b>মোট স্টক</b><h2 id="totalStock">0</h2></div>
    <div class="stat"><b>স্টকের মোট ক্রয়মূল্য</b><h2 id="totalPurchaseValue">৳0</h2></div>
  </section>

  <section id="productsSection" class="card">
    <h2 id="formTitle">পণ্য যোগ করুন</h2>
    <form id="productForm">
      <label>Product ID</label>
      <input id="productId" placeholder="যেমন: NL-0001" required>

      <label>পণ্যের নাম</label>
      <input id="productName" placeholder="যেমন: Math Notebook" required>

      <label>ক্রয়মূল্য (প্রতি পিস)</label>
      <input id="purchasePrice" type="number" min="0" step="0.01" required>

      <label>MRP</label>
      <input id="mrp" type="number" min="0" step="0.01" required oninput="calculatePrice()">

      <label>ছাড় (টাকা)</label>
      <input id="discount" type="number" min="0" step="0.01" value="0" required oninput="calculatePrice()">

      <label>বিক্রয়মূল্য</label>
      <input id="sellingPrice" type="number" readonly>

      <label>স্টক</label>
      <input id="stock" type="number" min="0" step="1" required>

      <label>পণ্যের ছবি</label>
      <input id="productImage" type="file" accept="image/*">
      <img id="imagePreview" class="hidden" style="max-width:150px;max-height:150px;object-fit:contain">

      <div>
        <button class="primary" type="submit">পণ্য সংরক্ষণ করুন</button>
        <button class="secondary" type="button" onclick="resetForm()">বাতিল</button>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>পণ্যের তালিকা</h2>
    <input id="searchProduct" placeholder="পণ্যের নাম বা Product ID দিয়ে খুঁজুন..." oninput="displayProducts()">
    <div id="productList" class="grid"></div>
  </section>

  <section id="ordersSection" class="card hidden">
    <h2>অর্ডার তালিকা</h2>
    <button class="secondary" onclick="loadOrders()">রিফ্রেশ</button>
    <div id="orderList"></div>
  </section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
 getFirestore,collection,getDocs,doc,setDoc,deleteDoc,
 query,orderBy,runTransaction
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCY7V8_MgILkg4yAauiqzKZ3Uo3w_o_B4",
 authDomain:"nirjhor-library.firebaseapp.com",
 projectId:"nirjhor-library",
 storageBucket:"nirjhor-library.firebasestorage.app",
 messagingSenderId:"771313980493",
 appId:"1:771313980493:web:ff76cbd83d88e102fd7804",
 measurementId:"G-213SK9BK75"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let products=[];
let editingId=null;
let selectedImage="";
let scanner=null;
let scannerRunning=false;

const $=id=>document.getElementById(id);
const money=n=>"৳"+Number(n||0).toLocaleString("en-US");
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

window.login=async function(){
 if($("adminPassword").value!=="Rakibul82#"){
  $("loginMessage").textContent="পাসওয়ার্ড সঠিক নয়।";
  return;
 }
 sessionStorage.setItem("nirjhorAdminAuthTime",String(Date.now()));
 openAdmin();
};

function openAdmin(){
 $("loginBox").classList.add("hidden");
 $("adminArea").classList.remove("hidden");
 ["homeButton","scannerButton","notificationButton","ordersButton","logoutButton"]
  .forEach(id=>$(id).classList.remove("hidden"));
 loadProducts().then(()=>showStockNoticeOnLogin());
 loadOrders();
}

window.logout=async function(){
 await closeScanner();
 sessionStorage.removeItem("nirjhorAdminAuthTime");
 $("adminArea").classList.add("hidden");
 $("loginBox").classList.remove("hidden");
 ["homeButton","scannerButton","notificationButton","ordersButton","logoutButton"]
  .forEach(id=>$(id).classList.add("hidden"));
};

window.showSection=function(id){
 ["productsSection","ordersSection","scannerSection"].forEach(s=>$(s).classList.add("hidden"));
 $(id).classList.remove("hidden");
 if(id==="productsSection")$("dashboard").classList.remove("hidden");
 else $("dashboard").classList.add("hidden");
};

window.calculatePrice=function(){
 const mrp=Number($("mrp").value||0);
 const discount=Number($("discount").value||0);
 $("sellingPrice").value=discount<=mrp?Math.max(0,mrp-discount):0;
};

$("productImage").addEventListener("change",async e=>{
 const file=e.target.files[0];
 if(!file)return;
 if(!file.type.startsWith("image/")){alert("একটি ছবি নির্বাচন করো।");return;}
 try{
  selectedImage=await compressImage(file);
  $("imagePreview").src=selectedImage;
  $("imagePreview").classList.remove("hidden");
 }catch(err){alert("ছবি প্রস্তুত করা যায়নি। অন্য ছবি চেষ্টা করো।");}
});

function compressImage(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=reject;
  reader.onload=()=>{
   const img=new Image();
   img.onerror=reject;
   img.onload=()=>{
    const canvas=document.createElement("canvas");
    const scale=Math.min(1,800/Math.max(img.width,img.height));
    canvas.width=Math.round(img.width*scale);
    canvas.height=Math.round(img.height*scale);
    const ctx=canvas.getContext("2d");
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    let quality=.75,result=canvas.toDataURL("image/jpeg",quality);
    while(result.length>850000&&quality>.25){
     quality-=.1;result=canvas.toDataURL("image/jpeg",quality);
    }
    if(result.length>950000){reject(new Error("image too large"));return;}
    resolve(result);
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}

$("productForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const productId=$("productId").value.trim();
 const productName=$("productName").value.trim();
 const purchasePrice=Number($("purchasePrice").value);
 const mrp=Number($("mrp").value);
 const discount=Number($("discount").value);
 const sellingPrice=Number($("sellingPrice").value);
 const stock=Number($("stock").value);

 if(!productId||!productName)return alert("Product ID ও পণ্যের নাম লিখো।");
 if([purchasePrice,mrp,discount,stock].some(n=>!Number.isFinite(n)||n<0))
  return alert("মূল্য ও স্টক সঠিকভাবে লিখো।");
 if(!Number.isInteger(stock))return alert("স্টক পূর্ণ সংখ্যা হতে হবে।");
 if(discount>mrp)return alert("ছাড় MRP-এর চেয়ে বেশি হতে পারবে না।");

 try{
  const snap=await getDocs(collection(db,"products"));
  const duplicate=snap.docs.find(d=>
   d.id!==editingId&&String(d.data().productId||"").toLowerCase()===productId.toLowerCase()
  );
  if(duplicate)return alert("এই Product ID আগে থেকেই আছে।");

  const id=editingId||productId.replace(/[\/?#]/g,"_");
  const old=products.find(p=>p.firestoreId===editingId);
  const image=selectedImage||(old?.image||"");
  const data={productId,productName,purchasePrice,mrp,discount,sellingPrice,stock,image,updatedAt:Date.now()};

  await setDoc(doc(db,"products",id),data);
  const publicData={productId,productName,mrp,discount,sellingPrice,stock,image};
  await setDoc(doc(db,"publicProducts",id),publicData);

  alert("পণ্য সংরক্ষণ হয়েছে।");
  resetForm();
  await loadProducts();
 }catch(err){
  console.error(err);
  alert("সংরক্ষণ হয়নি। Firebase Rules ও ইন্টারনেট পরীক্ষা করো।");
 }
});

window.resetForm=function(){
 $("productForm").reset();
 $("discount").value=0;
 $("sellingPrice").value="";
 $("imagePreview").src="";
 $("imagePreview").classList.add("hidden");
 selectedImage="";
 editingId=null;
 $("formTitle").textContent="পণ্য যোগ করুন";
};

async function loadProducts(){
 try{
  const snap=await getDocs(collection(db,"products"));
  products=snap.docs.map(d=>({...d.data(),firestoreId:d.id}));
  displayProducts();
  updateDashboard();
  updateLowStockCount();
 }catch(err){
  console.error(err);
  alert("পণ্য লোড হয়নি। Firebase সংযোগ ও Rules পরীক্ষা করো।");
 }
}

function updateDashboard(){
 $("totalProducts").textContent=products.length;
 $("totalStock").textContent=products.reduce((s,p)=>s+Number(p.stock||0),0);
 $("totalPurchaseValue").textContent=money(products.reduce((s,p)=>s+Number(p.stock||0)*Number(p.purchasePrice||0),0));
}

window.displayProducts=function(){
 const term=$("searchProduct").value.trim().toLowerCase();
 const list=products.filter(p=>
  String(p.productName||"").toLowerCase().includes(term)||
  String(p.productId||"").toLowerCase().includes(term)
 );
 $("productList").innerHTML=list.map(p=>`
  <article class="product">
   ${p.image?`<img src="${p.image}" alt="পণ্যের ছবি">`:"<p>ছবি নেই</p>"}
   <h3>${safe(p.productName)}</h3>
   <p>Product ID: ${safe(p.productId)}</p>
   <p>ক্রয়মূল্য: ${money(p.purchasePrice)}</p>
   <p>MRP: ${money(p.mrp)}</p>
   <p>ছাড়: ${money(p.discount)}</p>
   <p><b>বিক্রয়মূল্য: ${money(p.sellingPrice)}</b></p>
   <p>স্টক: <b>${Number(p.stock||0)}</b></p>
   <div id="qr-${safe(p.firestoreId)}"></div>
   <button class="primary" onclick="makeQR('${safe(p.firestoreId)}')">QR তৈরি</button>
   <button class="secondary" onclick="editProduct('${safe(p.firestoreId)}')">Edit</button>
   <button class="danger" onclick="removeProduct('${safe(p.firestoreId)}')">Delete</button>
  </article>
 `).join("")||"<p>কোনো পণ্য পাওয়া যায়নি।</p>";
};

window.editProduct=function(id){
 const p=products.find(x=>x.firestoreId===id);
 if(!p)return;
 editingId=id;
 $("productId").value=p.productId||"";
 $("productName").value=p.productName||"";
 $("purchasePrice").value=p.purchasePrice??0;
 $("mrp").value=p.mrp??0;
 $("discount").value=p.discount??0;
 $("sellingPrice").value=p.sellingPrice??0;
 $("stock").value=p.stock??0;
 selectedImage=p.image||"";
 if(selectedImage){$("imagePreview").src=selectedImage;$("imagePreview").classList.remove("hidden");}
 else $("imagePreview").classList.add("hidden");
 $("formTitle").textContent="পণ্য সম্পাদনা";
 $("productsSection").scrollIntoView({behavior:"smooth"});
};

window.removeProduct=async function(id){
 if(!confirm("এই পণ্যটি মুছে ফেলতে চাও?"))return;
 try{
  await deleteDoc(doc(db,"products",id));
  await deleteDoc(doc(db,"publicProducts",id));
  await loadProducts();
 }catch(e){alert("পণ্য মুছতে সমস্যা হয়েছে।");}
};

window.makeQR=function(id){
 const p=products.find(x=>x.firestoreId===id);
 if(!p)return;
 const target=$("qr-"+id);
 target.innerHTML="";
 const url=new URL("product1.html?id="+encodeURIComponent(p.productId),location.href).href;
 new QRCode(target,{text:url,width:180,height:180});
 const btn=document.createElement("button");
 btn.className="secondary";btn.textContent="QR Code Download";
 btn.onclick=()=>{
  const canvas=target.querySelector("canvas");
  const img=target.querySelector("img");
  const data=canvas?canvas.toDataURL("image/png"):img?.src;
  if(!data)return alert("QR তৈরি হয়নি।");
  const a=document.createElement("a");
  a.href=data;a.download=(p.productId||"product")+"-QR.png";a.click();
 };
 target.appendChild(btn);
};

window.openScanner=async function(){
 showSection("scannerSection");
 $("scannerResult").innerHTML="";
 if(!window.Html5Qrcode){alert("QR Scanner লোড হয়নি। ইন্টারনেট চালু করে পেজ রিফ্রেশ করো।");return;}
 if(scannerRunning)return;
 try{
  scanner=new Html5Qrcode("qrReader");
  await scanner.start(
   {facingMode:"environment"},
   {fps:10,qrbox:{width:240,height:240}},
   async text=>{
    await stopCamera();
    showScannedProduct(text);
   },
   ()=>{}
  );
  scannerRunning=true;
 }catch(err){
  alert("ক্যামেরা চালু হয়নি। GitHub Pages-এর HTTPS ও Camera Permission পরীক্ষা করো।");
 }
};

async function stopCamera(){
 if(scanner&&scannerRunning){
  try{await scanner.stop();}catch(e){}
  try{await scanner.clear();}catch(e){}
 }
 scannerRunning=false;
 scanner=null;
}

window.closeScanner=async function(){
 await stopCamera();
 $("scannerSection").classList.add("hidden");
};

function showScannedProduct(text){
 let id=text;
 try{
  const url=new URL(text);
  id=url.searchParams.get("id")||text;
 }catch(e){}
 const p=products.find(x=>
  String(x.productId||"").toLowerCase()===String(id).toLowerCase()||
  String(x.firestoreId||"").toLowerCase()===String(id).toLowerCase()
 );
 if(!p){
  $("scannerResult").innerHTML="<p>এই QR-এর পণ্য অ্যাডমিন তালিকায় পাওয়া যায়নি।</p>";
  $("scannerSection").classList.remove("hidden");
  return;
 }
 $("scannerResult").innerHTML=`
  <div class="product">
   ${p.image?`<img src="${p.image}" alt="পণ্য">`:""}
   <h3>${safe(p.productName)}</h3>
   <p>Product ID: ${safe(p.productId)}</p>
   <p>MRP: ${money(p.mrp)}</p>
   <p>ছাড়: ${money(p.discount)}</p>
   <p>বিক্রয়মূল্য: ${money(p.sellingPrice)}</p>
   <p>ক্রয়মূল্য (শুধু অ্যাডমিন): ${money(p.purchasePrice)}</p>
   <p>বর্তমান স্টক: ${Number(p.stock||0)}</p>
  </div>`;
 $("scannerSection").classList.remove("hidden");
}

function lowStockProducts(){
 return products.filter(p=>Number(p.stock??0)<=3);
}
function updateLowStockCount(){
 $("lowCount").textContent=lowStockProducts().length;
}
function getDismissed(){
 try{return JSON.parse(localStorage.getItem("nirjhorDismissedStockNotices")||"{}");}
 catch(e){return {};}
}
function renderLowStock(list,filterDismissed){
 const dismissed=getDismissed();
 const items=list.filter(p=>!filterDismissed||dismissed[p.firestoreId]!==String(p.stock));
 $("stockNoticeList").innerHTML=items.map(p=>{
  const out=Number(p.stock||0)===0;
  return `<div class="alert ${out?"out":""}">
   <button class="close-notice" onclick="dismissStock('${safe(p.firestoreId)}')">✕</button>
   <b>${safe(p.productName)}</b><br>
   Product ID: ${safe(p.productId)}<br>
   বর্তমান স্টক: <b>${Number(p.stock||0)}</b><br>
   ${out?"⚠️ স্টক শেষ! দ্রুত পণ্য সংগ্রহ করো।":"⚠️ স্টক কম! দ্রুত নতুন পণ্য সংগ্রহ করো।"}
  </div>`;
 }).join("")||"<p>এখন কোনো নতুন স্টক সতর্কতা নেই।</p>";
 $("stockNotice").classList.remove("hidden");
}
function showStockNoticeOnLogin(){
 const list=lowStockProducts();
 const dismissed=getDismissed();
 const fresh=list.filter(p=>dismissed[p.firestoreId]!==String(p.stock));
 if(fresh.length)renderLowStock(fresh,false);
 else $("stockNotice").classList.add("hidden");
}
window.showAllLowStock=function(){
 renderLowStock(lowStockProducts(),false);
};
window.dismissStock=function(id){
 const p=products.find(x=>x.firestoreId===id);
 if(!p)return;
 const dismissed=getDismissed();
 dismissed[id]=String(p.stock);
 localStorage.setItem("nirjhorDismissedStockNotices",JSON.stringify(dismissed));
 renderLowStock(lowStockProducts(),true);
};

async function loadOrders(){
 const area=$("orderList");
 area.innerHTML="<p>অর্ডার লোড হচ্ছে...</p>";
 try{
  const snap=await getDocs(collection(db,"orders"));
  if(snap.empty){area.innerHTML="<p>কোনো অর্ডার নেই।</p>";return;}
  area.innerHTML=snap.docs.map(d=>{
   const o=d.data();
   const items=Array.isArray(o.items)?o.items:[];
   return `<article class="product">
    <h3>অর্ডার: ${safe(d.id)}</h3>
    <p>নাম: ${safe(o.customerName||o.name||"—")}</p>
    <p>ফোন: ${safe(o.phone||"—")}</p>
    <p>ঠিকানা: ${safe(o.address||"—")}</p>
    <p>স্ট্যাটাস: <b>${safe(o.status||"pending")}</b></p>
    <p>মোট: ${money(o.total||o.totalAmount||0)}</p>
    <p>পণ্য: ${items.map(i=>safe(i.productName||i.name||i.productId||"পণ্য")+" × "+Number(i.quantity||i.qty||1)).join(", ")||"—"}</p>
    <button class="primary" onclick="changeOrderStatus('${safe(d.id)}','confirmed')">Confirm</button>
    <button class="warning" onclick="changeOrderStatus('${safe(d.id)}','cancelled')">Cancel</button>
    <button class="danger" onclick="deleteOrder('${safe(d.id)}')">Delete</button>
   </article>`;
  }).join("");
 }catch(e){
  console.error(e);
  area.innerHTML="<p>অর্ডার লোড হয়নি। Firebase Rules পরীক্ষা করো।</p>";
 }
}
window.changeOrderStatus=async function(id,status){
 if(!confirm("অর্ডারের স্ট্যাটাস "+status+" করতে চাও?"))return;
 try{
  await setDoc(doc(db,"orders",id),{status,adminUpdatedAt:Date.now()},{merge:true});
  await loadOrders();
 }catch(e){alert("অর্ডার আপডেট হয়নি।");}
};
window.deleteOrder=async function(id){
 if(!confirm("অর্ডার মুছে ফেলতে চাও?"))return;
 try{await deleteDoc(doc(db,"orders",id));await loadOrders();}
 catch(e){alert("অর্ডার মুছতে সমস্যা হয়েছে।");}
};

if(sessionStorage.getItem("nirjhorAdminAuthTime")){
 const elapsed=Date.now()-Number(sessionStorage.getItem("nirjhorAdminAuthTime"));
 if(elapsed>=0&&elapsed<10*60*1000)openAdmin();
 else sessionStorage.removeItem("nirjhorAdminAuthTime");
}
</script>
</body>
</html>
