<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - নির্ঝর লাইব্রেরী</title>

<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;padding:16px;background:#f4f6f8;color:#222}
h1{text-align:center}
.container{max-width:1100px;margin:auto}
.box,.dashboard-card,.product-card,.order-card{background:white;padding:18px;border-radius:10px;box-shadow:0 2px 9px #00000012;margin-bottom:16px}
.box{max-width:800px;margin:20px auto}
label{display:block;font-weight:bold;margin:13px 0 5px}
input{width:100%;padding:11px;border:1px solid #ccc;border-radius:6px;font-size:15px}
button{padding:10px 14px;border:0;border-radius:6px;cursor:pointer;font-size:15px;margin:4px 0}
.primary{background:#087bdb;color:white}
.danger{background:#dc3545;color:white}
.success{background:#198754;color:white}
.warning{background:#ffc107;color:#222}
.gray{background:#777;color:white}
button:disabled{opacity:.6;cursor:not-allowed}
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.dashboard-card{text-align:center}
.dashboard-card p{font-size:24px;font-weight:bold;color:#087bdb;margin:8px 0}
.products,.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.product-card,.order-card{margin:0;overflow-wrap:anywhere}
.product-card img{width:100%;height:180px;object-fit:contain;background:#f5f5f5}
.price{font-size:20px;font-weight:bold;color:green}
.muted{color:#666;font-size:13px}
.preview img{max-width:180px;max-height:180px;margin-top:10px}
.qr-box{display:none;text-align:center;background:#f8f9fa;padding:12px;margin-top:10px;overflow-wrap:anywhere}
.qr-box canvas,.qr-box img{max-width:100%}
.section-title{margin-top:30px}
#adminPanel,#loginBox{display:none}
.message{padding:12px;border-radius:6px;background:#e8f5e9;margin:12px 0;overflow-wrap:anywhere;white-space:pre-wrap}
.error{background:#ffebee;color:#b71c1c}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row button{flex:1}
[hidden]{display:none!important}
</style>
</head>

<body>
<div class="container">
<h1>নির্ঝর লাইব্রেরী</h1>

<!-- LOGIN -->
<div id="loginBox" class="box">
  <h2>Admin Login</h2>
  <p>নির্ঝর লাইব্রেরী Admin Panel</p>

  <form id="loginForm">
    <label for="loginPassword">Admin Password</label>
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="পাসওয়ার্ড লিখুন" required>
    <button id="loginButton" class="primary" type="submit">Login</button>
  </form>

  <div id="loginMessage" class="message" hidden></div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
  <div class="box">
    <div class="row">
      <div style="flex:2">
        <strong>ADMIN PANEL</strong>
        <p id="adminEmail" class="muted">নির্ঝর লাইব্রেরী Admin</p>
      </div>
      <button id="logoutButton" class="danger" type="button">Logout</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard">
    <div class="dashboard-card"><h3>মোট পণ্য</h3><p id="totalProducts">0</p></div>
    <div class="dashboard-card"><h3>মোট স্টক</h3><p id="totalStock">0</p></div>
    <div class="dashboard-card"><h3>স্টকের মোট ক্রয়মূল্য</h3><p id="totalPurchaseValue">৳0</p></div>
    <div class="dashboard-card"><h3>পেন্ডিং অর্ডার</h3><p id="pendingOrders">0</p></div>
  </div>

  <!-- PRODUCT FORM -->
  <div class="box">
    <h2 id="formTitle">নতুন পণ্য যোগ করুন</h2>

    <form id="productForm">
      <label for="productId">Product ID</label>
      <input id="productId" required maxlength="80" placeholder="NL-0001">

      <label for="productName">পণ্যের নাম</label>
      <input id="productName" required maxlength="150" placeholder="Math Notebook">

      <label for="productImage">পণ্যের ছবি</label>
      <input id="productImage" type="file" accept="image/*">
      <div id="imagePreview" class="preview"></div>

      <label for="purchasePrice">ক্রয়মূল্য (প্রতি পিস)</label>
      <input id="purchasePrice" type="number" min="0" step="0.01" required>

      <label for="mrp">MRP</label>
      <input id="mrp" type="number" min="0" step="0.01" required>

      <label for="discount">Discount</label>
      <input id="discount" type="number" min="0" step="0.01" value="0" required>

      <label for="sellingPrice">Selling Price</label>
      <input id="sellingPrice" readonly>

      <label for="stock">Stock</label>
      <input id="stock" type="number" min="0" step="1" required>

      <button id="saveButton" class="primary" type="submit">পণ্য সংরক্ষণ করুন</button>
      <button id="cancelButton" class="gray" type="button" hidden>Edit বাতিল</button>
      <div id="productMessage" class="message" hidden></div>
    </form>
  </div>

  <!-- SEARCH -->
  <div class="box">
    <h2>পণ্য খুঁজুন</h2>
    <input id="searchInput" placeholder="পণ্যের নাম বা Product ID">
  </div>

  <div id="products" class="products"></div>

  <!-- ORDERS -->
  <h2 class="section-title">কাস্টমারের অর্ডার</h2>
  <div class="box">
    <button id="refreshOrdersButton" class="primary" type="button">অর্ডার রিফ্রেশ করুন</button>
    <div id="orderMessage" class="message" hidden></div>
  </div>
  <div id="orders" class="orders"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  deleteDoc,
  runTransaction,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

/*
  Firebase config তোমার আগের প্রজেক্টের।
  API Key সমস্যা থাকলে Firebase Console-এ ঠিক করতে হবে।
*/
const firebaseConfig = {
  apiKey: "AIzaSyCY7V8_MgILkg4yAauiqzKZ3Uo3w_o_B4",
  authDomain: "nirjhor-library.firebaseapp.com",
  projectId: "nirjhor-library",
  storageBucket: "nirjhor-library.firebasestorage.app",
  messagingSenderId: "771313980493",
  appId: "1:771313980493:web:ff76cbd83d88e102fd7804",
  measurementId: "G-213SK9BK75"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/*
  সতর্কতা:
  এটি ব্রাউজার-সাইড পাসওয়ার্ড।
  ওয়েবসাইটের কোড দেখা যায় এমন কেউ পাসওয়ার্ড জানতে পারে।
*/
const ADMIN_PASSWORD = "Rakibul82#";

const $ = id => document.getElementById(id);

let products = [];
let orders = [];
let editingId = null;
let selectedImage = "";
let busy = false;

function message(id, text, error = false) {
  $(id).hidden = false;
  $(id).textContent = text;
  $(id).className = error ? "message error" : "message";
}

function money(n) {
  return "৳" + Number(n || 0).toLocaleString("en-BD");
}

function safeText(value) {
  return String(value ?? "");
}

function showAdmin() {
  $("loginBox").style.display = "none";
  $("adminPanel").style.display = "block";
}

function showLogin() {
  $("adminPanel").style.display = "none";
  $("loginBox").style.display = "block";
}

showLogin();

/* LOGIN */
$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  $("loginButton").disabled = true;
  $("loginMessage").hidden = true;

  if ($("loginPassword").value !== ADMIN_PASSWORD) {
    message("loginMessage", "পাসওয়ার্ড সঠিক নয়। আবার চেষ্টা করুন।", true);
    $("loginPassword").value = "";
    $("loginButton").disabled = false;
    return;
  }

  showAdmin();
  $("adminEmail").textContent = "নির্ঝর লাইব্রেরী Admin";
  $("loginPassword").value = "";

  try {
    await loadProducts();
    await loadOrders();
  } catch (error) {
    console.error("FIRESTORE ERROR:", error);
    message(
      "loginMessage",
      "Login হয়েছে, কিন্তু Firebase ডেটা লোড হয়নি। Error: " +
      (error.code || "") + " — " + error.message,
      true
    );
    showLogin();
  } finally {
    $("loginButton").disabled = false;
  }
});

/* LOGOUT */
$("logoutButton").addEventListener("click", () => {
  showLogin();
  $("loginPassword").value = "";
  $("loginMessage").hidden = true;
});

/* SELLING PRICE */
function calculateSellingPrice() {
  const mrp = Number($("mrp").value || 0);
  const discount = Number($("discount").value || 0);
  $("sellingPrice").value = discount <= mrp ? mrp - discount : 0;
}
$("mrp").addEventListener("input", calculateSellingPrice);
$("discount").addEventListener("input", calculateSellingPrice);

/* IMAGE COMPRESSION */
$("productImage").addEventListener("change", event => {
  const file = event.target.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    message("productMessage", "একটি ছবির ফাইল নির্বাচন করুন।", true);
    return;
  }

  const reader = new FileReader();

  reader.onload = e => {
    const img = new Image();

    img.onload = () => {
      const canvas = document.createElement("canvas");
      const scale = Math.min(1, 800 / Math.max(img.width, img.height));

      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);

      let quality = 0.8;
      let result = canvas.toDataURL("image/jpeg", quality);

      while (result.length > 850000 && quality > 0.25) {
        quality -= 0.1;
        result = canvas.toDataURL("image/jpeg", quality);
      }

      if (result.length > 950000) {
        selectedImage = "";
        message("productMessage", "ছবিটি অনেক বড়। আরও ছোট ছবি ব্যবহার করুন।", true);
        return;
      }

      selectedImage = result;
      $("imagePreview").replaceChildren();

      const preview = document.createElement("img");
      preview.src = result;
      preview.alt = "পণ্যের ছবি";
      $("imagePreview").appendChild(preview);
    };

    img.onerror = () => message("productMessage", "ছবিটি পড়া যায়নি। অন্য ছবি ব্যবহার করুন।", true);
    img.src = e.target.result;
  };

  reader.readAsDataURL(file);
});

/* LOAD PRODUCTS */
async function loadProducts() {
  const snap = await getDocs(collection(db, "products"));

  products = snap.docs.map(d => ({
    ...d.data(),
    firestoreId: d.id
  }));

  renderProducts();
  updateDashboard();
}

/* LOAD ORDERS */
async function loadOrders() {
  const snap = await getDocs(collection(db, "orders"));

  orders = snap.docs.map(d => ({
    ...d.data(),
    firestoreId: d.id
  }));

  renderOrders();
  updateDashboard();
}

/* DASHBOARD */
function updateDashboard() {
  $("totalProducts").textContent = products.length;

  let totalStock = 0;
  let totalValue = 0;

  for (const p of products) {
    const stock = Number(p.stock || 0);
    totalStock += stock;
    totalValue += stock * Number(p.purchasePrice || 0);
  }

  $("totalStock").textContent = totalStock;
  $("totalPurchaseValue").textContent = money(totalValue);

  $("pendingOrders").textContent = orders.filter(
    o => o.orderStatus === "pending_confirmation"
  ).length;
}

/* DOM HELPERS */
function addText(parent, tag, text, className = "") {
  const el = document.createElement(tag);
  el.textContent = text;
  if (className) el.className = className;
  parent.appendChild(el);
  return el;
}

function addButton(parent, text, className, handler) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = text;
  button.className = className;
  button.addEventListener("click", handler);
  parent.appendChild(button);
  return button;
}

/* RENDER PRODUCTS */
function renderProducts() {
  const root = $("products");
  root.replaceChildren();

  const term = $("searchInput").value.trim().toLowerCase();

  const filtered = products.filter(p =>
    safeText(p.productName).toLowerCase().includes(term) ||
    safeText(p.productId).toLowerCase().includes(term)
  );

  if (!filtered.length) {
    addText(root, "p", "কোনো পণ্য পাওয়া যায়নি।");
    return;
  }

  for (const p of filtered) {
    const card = document.createElement("div");
    card.className = "product-card";

    if (p.image) {
      const img = document.createElement("img");
      img.src = p.image;
      img.alt = p.productName || "পণ্য";
      card.appendChild(img);
    }

    addText(card, "h3", p.productName || "পণ্যের নাম নেই");
    addText(card, "p", "Product ID: " + (p.productId || p.firestoreId), "muted");
    addText(card, "p", "ক্রয়মূল্য: " + money(p.purchasePrice));
    addText(card, "p", "MRP: " + money(p.mrp));
    addText(card, "p", "Discount: " + money(p.discount));
    addText(card, "p", "Selling Price: " + money(p.sellingPrice), "price");
    addText(card, "p", "Stock: " + Number(p.stock || 0));

    const row = document.createElement("div");
    row.className = "row";
    card.appendChild(row);

    addButton(row, "Edit", "warning", () => editProduct(p.firestoreId));
    addButton(row, "Delete", "danger", () => removeProduct(p.firestoreId));

    const qrBox = document.createElement("div");
    qrBox.className = "qr-box";
    card.appendChild(qrBox);

    addButton(card, "QR Code দেখুন", "success", () => {
      if (qrBox.style.display === "block") {
        qrBox.style.display = "none";
        qrBox.replaceChildren();
        return;
      }

      qrBox.style.display = "block";
      qrBox.replaceChildren();

      const id = p.productId || p.firestoreId;
      const url = new URL("product1.html", window.location.href);
      url.searchParams.set("id", id);

      const qrTarget = document.createElement("div");
      qrBox.appendChild(qrTarget);

      new QRCode(qrTarget, {
        text: url.href,
        width: 200,
        height: 200
      });

      addText(qrBox, "p", url.href, "muted");

      addButton(qrBox, "QR Code Download", "primary", () => {
        const canvas = qrTarget.querySelector("canvas");
        const image = qrTarget.querySelector("img");
        const href = canvas ? canvas.toDataURL("image/png") : image?.src;

        if (!href) {
          alert("QR তৈরি হয়নি।");
          return;
        }

        const a = document.createElement("a");
        a.href = href;
        a.download = id + "-QR.png";
        a.click();
      });
    });

    root.appendChild(card);
  }
}

$("searchInput").addEventListener("input", renderProducts);

/* EDIT PRODUCT */
function editProduct(id) {
  const p = products.find(item => item.firestoreId === id);
  if (!p) return;

  editingId = id;
  $("productId").value = p.productId || id;
  $("productId").disabled = true;
  $("productName").value = p.productName || "";
  $("purchasePrice").value = Number(p.purchasePrice || 0);
  $("mrp").value = Number(p.mrp || 0);
  $("discount").value = Number(p.discount || 0);
  $("sellingPrice").value = Number(p.sellingPrice || 0);
  $("stock").value = Number(p.stock || 0);

  selectedImage = p.image || "";
  $("imagePreview").replaceChildren();

  if (selectedImage) {
    const img = document.createElement("img");
    img.src = selectedImage;
    img.alt = "বর্তমান ছবি";
    $("imagePreview").appendChild(img);
  }

  $("formTitle").textContent = "পণ্য সম্পাদনা করুন";
  $("saveButton").textContent = "পণ্য আপডেট করুন";
  $("cancelButton").hidden = false;
  $("productMessage").hidden = true;

  window.scrollTo(0, 0);
}

/* RESET FORM */
function resetForm() {
  editingId = null;
  selectedImage = "";

  $("productForm").reset();
  $("productId").disabled = false;
  $("imagePreview").replaceChildren();
  $("sellingPrice").value = "";
  $("formTitle").textContent = "নতুন পণ্য যোগ করুন";
  $("saveButton").textContent = "পণ্য সংরক্ষণ করুন";
  $("cancelButton").hidden = true;
  $("productMessage").hidden = true;
}

$("cancelButton").addEventListener("click", resetForm);

/* SAVE PRODUCT */
$("productForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (busy) return;

  const id = $("productId").value.trim();
  const name = $("productName").value.trim();
  const purchase = Number($("purchasePrice").value);
  const mrp = Number($("mrp").value);
  const discount = Number($("discount").value);
  const stock = Number($("stock").value);
  const price = mrp - discount;

  if (!/^[A-Za-z0-9_-]{1,80}$/.test(id)) {
    message("productMessage", "Product ID-তে শুধু ইংরেজি অক্ষর, সংখ্যা, - অথবা _ ব্যবহার করুন।", true);
    return;
  }

  if (
    !name ||
    !Number.isFinite(purchase) || purchase < 0 ||
    !Number.isFinite(mrp) || mrp < 0 ||
    !Number.isFinite(discount) || discount < 0 || discount > mrp ||
    !Number.isSafeInteger(stock) || stock < 0
  ) {
    message("productMessage", "সব তথ্য সঠিকভাবে দিন। Discount যেন MRP-এর বেশি না হয়।", true);
    return;
  }

  const old = editingId ? products.find(p => p.firestoreId === editingId) : null;
  const image = selectedImage || old?.image || "";

  if (!image) {
    message("productMessage", "পণ্যের ছবি নির্বাচন করুন।", true);
    return;
  }

  if (!editingId && products.some(p => p.firestoreId === id)) {
    message("productMessage", "এই Product ID আগে থেকেই আছে।", true);
    return;
  }

  const fullProduct = {
    productId: id,
    productName: name,
    image,
    purchasePrice: purchase,
    mrp,
    discount,
    sellingPrice: price,
    stock
  };

  const publicProduct = {
    productId: id,
    productName: name,
    image,
    mrp,
    discount,
    sellingPrice: price,
    stock
  };

  busy = true;
  $("saveButton").disabled = true;

  try {
    await setDoc(doc(db, "products", id), fullProduct);
    await setDoc(doc(db, "publicProducts", id), publicProduct);

    message("productMessage", editingId ? "পণ্য আপডেট হয়েছে।" : "পণ্য সংরক্ষণ হয়েছে।");
    resetForm();
    await loadProducts();
  } catch (error) {
    console.error(error);
    message("productMessage", "পণ্য সংরক্ষণ হয়নি। Error: " + (error.code || "") + " — " + error.message, true);
  } finally {
    busy = false;
    $("saveButton").disabled = false;
  }
});

/* DELETE PRODUCT */
async function removeProduct(id) {
  const p = products.find(item => item.firestoreId === id);
  if (!p) return;

  const hasOrders = orders.some(
    o => o.productDocumentId === id && o.orderStatus !== "cancelled"
  );

  if (hasOrders) {
    alert("এই পণ্যের অর্ডার আছে। আগে অর্ডারগুলো যাচাই করুন; আপাতত পণ্য মুছবেন না।");
    return;
  }

  if (!confirm("এই পণ্যটি মুছে ফেলতে চান?")) return;

  try {
    await deleteDoc(doc(db, "products", id));
    await deleteDoc(doc(db, "publicProducts", id));
    await loadProducts();
    alert("পণ্য মুছে ফেলা হয়েছে।");
  } catch (error) {
    console.error(error);
    alert("পণ্য মুছতে সমস্যা হয়েছে। Error: " + (error.code || "") + " — " + error.message);
  }
}

/* RENDER ORDERS */
function renderOrders() {
  const root = $("orders");
  root.replaceChildren();

  if (!orders.length) {
    addText(root, "p", "এখনো কোনো অর্ডার নেই।");
    return;
  }

  const sorted = [...orders].sort(
    (a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)
  );

  for (const o of sorted) {
    const card = document.createElement("div");
    card.className = "order-card";

    addText(card, "h3", o.productName || "পণ্য");
    addText(card, "p", "অর্ডার নম্বর: " + o.firestoreId);
    addText(card, "p", "কাস্টমার: " + (o.customerName || ""));
    addText(card, "p", "মোবাইল: " + (o.phone || ""));
    addText(card, "p", "ঠিকানা: " + (o.address || "দেওয়া হয়নি"));
    addText(card, "p", "পরিমাণ: " + Number(o.quantity || 0));
    addText(card, "p", "একক মূল্য: " + money(o.unitPrice));
    addText(card, "p", "মোট: " + money(o.totalPrice));
    addText(card, "p", "পেমেন্ট: " + (o.paymentStatus || "unpaid"));
    addText(card, "p", "অর্ডার অবস্থা: " + (o.orderStatus || "unknown"));

    if (o.orderStatus === "pending_confirmation") {
      const row = document.createElement("div");
      row.className = "row";
      card.appendChild(row);

      addButton(row, "অর্ডার নিশ্চিত", "success", () => confirmOrder(o.firestoreId));
      addButton(row, "অর্ডার বাতিল", "danger", () => cancelOrder(o.firestoreId));
    }

    root.appendChild(card);
  }
}

/* CONFIRM ORDER AND REDUCE STOCK */
async function confirmOrder(orderId) {
  if (!confirm("অর্ডার নিশ্চিত করবেন? স্টক একবার কমানো হবে।")) return;

  try {
    await runTransaction(db, async transaction => {
      const orderRef = doc(db, "orders", orderId);
      const orderSnap = await transaction.get(orderRef);

      if (!orderSnap.exists()) throw new Error("অর্ডার পাওয়া যায়নি।");

      const order = orderSnap.data();

      if (order.orderStatus !== "pending_confirmation" || order.stockDeducted === true) {
        throw new Error("এই অর্ডারটি আগে থেকেই প্রক্রিয়া করা হয়েছে।");
      }

      const productId = order.productDocumentId;
      const productRef = doc(db, "products", productId);
      const publicRef = doc(db, "publicProducts", productId);

      const productSnap = await transaction.get(productRef);
      const publicSnap = await transaction.get(publicRef);

      if (!productSnap.exists()) throw new Error("পণ্যটি আর পাওয়া যাচ্ছে না।");

      const product = productSnap.data();
      const quantity = Number(order.quantity);

      if (!Number.isSafeInteger(quantity) || quantity < 1) {
        throw new Error("অর্ডারের পরিমাণ সঠিক নয়।");
      }

      const currentStock = Number(product.stock || 0);

      if (currentStock < quantity) {
        throw new Error("পর্যাপ্ত স্টক নেই। অর্ডার নিশ্চিত করা যায়নি।");
      }

      const newStock = currentStock - quantity;

      transaction.update(productRef, { stock: newStock });

      if (publicSnap.exists()) {
        transaction.update(publicRef, { stock: newStock });
      }

      transaction.update(orderRef, {
        orderStatus: "confirmed",
        stockDeducted: true,
        confirmedAt: serverTimestamp()
      });
    });

    message("orderMessage", "অর্ডার নিশ্চিত হয়েছে এবং স্টক আপডেট হয়েছে।");
    await loadProducts();
    await loadOrders();
  } catch (error) {
    console.error(error);
    message("orderMessage", "অর্ডার নিশ্চিত করা যায়নি। Error: " + (error.code || "") + " — " + error.message, true);
  }
}

/* CANCEL ORDER */
async function cancelOrder(orderId) {
  if (!confirm("এই পেন্ডিং অর্ডারটি বাতিল করবেন?")) return;

  try {
    await runTransaction(db, async transaction => {
      const orderRef = doc(db, "orders", orderId);
      const snap = await transaction.get(orderRef);

      if (!snap.exists()) throw new Error("অর্ডার পাওয়া যায়নি।");

      const order = snap.data();

      if (order.orderStatus !== "pending_confirmation") {
        throw new Error("শুধু পেন্ডিং অর্ডার বাতিল করা যাবে।");
      }

      if (order.stockDeducted === true) {
        throw new Error("স্টক কমানো হয়েছে। এই অর্ডারটি স্বয়ংক্রিয়ভাবে বাতিল করা যাবে না।");
      }

      transaction.update(orderRef, {
        orderStatus: "cancelled",
        cancelledAt: serverTimestamp()
      });
    });

    message("orderMessage", "অর্ডার বাতিল হয়েছে।");
    await loadOrders();
  } catch (error) {
    console.error(error);
    message("orderMessage", "অর্ডার বাতিল করা যায়নি। Error: " + (error.code || "") + " — " + error.message, true);
  }
}

/* REFRESH ORDERS */
$("refreshOrdersButton").addEventListener("click", async () => {
  try {
    await loadOrders();
    message("orderMessage", "অর্ডার তালিকা আপডেট হয়েছে।");
  } catch (error) {
    console.error(error);
    message("orderMessage", "অর্ডার লোড হয়নি। Error: " + (error.code || "") + " — " + error.message, true);
  }
});
</script>
