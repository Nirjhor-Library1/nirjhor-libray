<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নির্ঝর লাইব্রেরী</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #146c43;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #00000012;
    }

    .product-image {
      display: block;
      width: 100%;
      max-width: 320px;
      max-height: 320px;
      object-fit: contain;
      margin: 0 auto 15px;
    }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 7px 0 13px;
      font-size: 16px;
      border-radius: 6px;
    }

    input, textarea {
      border: 1px solid #ccc;
      background: white;
    }

    button {
      border: none;
      background: #146c43;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .price {
      color: #146c43;
      font-size: 23px;
      font-weight: bold;
    }

    .old-price {
      color: #777;
      text-decoration: line-through;
    }

    .product-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .product-list .card {
      margin: 0;
    }

    .product-list .product-image {
      max-height: 200px;
    }

    .message {
      padding: 12px;
      border-radius: 6px;
      background: #e8f5e9;
      color: #155724;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .error {
      background: #ffebee;
      color: #b71c1c;
    }

    .muted { color: #666; }

    label { font-weight: bold; }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <header>
    <h1>নির্ঝর লাইব্রেরী</h1>
    <p>আপনার প্রয়োজনীয় পণ্য অর্ডার করুন</p>
  </header>

  <main class="container">
    <div id="status" class="card">পণ্যের তথ্য লোড হচ্ছে...</div>

    <section id="productSection" hidden>
      <div class="card">
        <img id="productImage" class="product-image" alt="পণ্যের ছবি">

        <h2 id="productName"></h2>
        <p>পণ্য আইডি: <strong id="productId"></strong></p>
        <p>মূল্য: <span id="mrp" class="old-price"></span></p>
        <p>ছাড়: <strong id="discount"></strong> টাকা</p>
        <p>বিক্রয়মূল্য: <span id="sellingPrice" class="price"></span></p>
        <p>স্টকে আছে: <strong id="stock"></strong> টি</p>
      </div>

      <div class="card">
        <h2>অর্ডার ফর্ম</h2>
        <p class="muted">অর্ডারটি দোকান থেকে নিশ্চিত করার পর স্টক কমানো হবে।</p>

        <form id="orderForm">
          <label for="customerName">আপনার নাম</label>
          <input id="customerName" type="text" maxlength="100"
                 required placeholder="আপনার নাম লিখুন">

          <label for="phone">মোবাইল নম্বর</label>
          <input id="phone" type="tel" maxlength="20"
                 required placeholder="মোবাইল নম্বর লিখুন">

          <label for="quantity">কতটি পণ্য লাগবে?</label>
          <input id="quantity" type="number" min="1" step="1"
                 value="1" required>

          <label for="address">ঠিকানা (ঐচ্ছিক)</label>
          <textarea id="address" rows="3" maxlength="500"
                    placeholder="আপনার ঠিকানা লিখুন"></textarea>

          <p>মোট মূল্য: <strong id="totalPrice">৳0</strong></p>

          <button id="orderButton" type="submit">অর্ডার নিশ্চিত করুন</button>
        </form>

        <div id="orderMessage" hidden></div>
      </div>
    </section>

    <section id="allProductsSection" hidden>
      <h2>আমাদের পণ্যসমূহ</h2>
      <div id="productList" class="product-list"></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs,
      getDoc,
      doc,
      addDoc,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCY7V8_MgILkg4yAauiqzKZ3Uo3w_o_B4",
      authDomain: "nirjhor-library.firebaseapp.com",
      projectId: "nirjhor-library",
      storageBucket: "nirjhor-library.firebasestorage.app",
      messagingSenderId: "771313980493",
      appId: "1:771313980493:web:ff76cbd83d88e102fd7804",
      measurementId: "G-213SK9BK75"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const statusBox = document.getElementById("status");
    const productSection = document.getElementById("productSection");
    const allProductsSection = document.getElementById("allProductsSection");
    const orderForm = document.getElementById("orderForm");
    const orderButton = document.getElementById("orderButton");
    const orderMessage = document.getElementById("orderMessage");
    const quantityInput = document.getElementById("quantity");

    let currentProduct = null;
    let currentDocumentId = null;
    let submitting = false;

    function showStatus(message, isError = false) {
      statusBox.hidden = false;
      statusBox.textContent = message;
      statusBox.className = isError ? "card message error" : "card";
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function money(value) {
      return "৳" + Number(value || 0).toLocaleString("en-BD");
    }

    function getSellingPrice(product) {
      const mrp = Number(product.mrp || 0);
      const discount = Number(product.discount || 0);
      return Number(
        product.sellingPrice ?? Math.max(0, mrp - discount)
      );
    }

    function showProduct(product, documentId) {
      currentProduct = product;
      currentDocumentId = documentId;

      statusBox.hidden = true;
      allProductsSection.hidden = true;
      productSection.hidden = false;

      document.getElementById("productName").textContent =
        product.productName || "পণ্যের নাম নেই";

      document.getElementById("productId").textContent =
        product.productId || documentId;

      document.getElementById("mrp").textContent =
        money(product.mrp);

      document.getElementById("discount").textContent =
        Number(product.discount || 0);

      document.getElementById("sellingPrice").textContent =
        money(getSellingPrice(product));

      document.getElementById("stock").textContent =
        Number(product.stock || 0);

      const image = document.getElementById("productImage");

      if (product.image) {
        image.src = product.image;
        image.hidden = false;
      } else {
        image.removeAttribute("src");
        image.hidden = true;
      }

      quantityInput.value = "1";
      quantityInput.max = String(Math.max(0, Number(product.stock || 0)));
      orderButton.disabled = Number(product.stock || 0) < 1;
      orderButton.textContent =
        Number(product.stock || 0) < 1 ? "স্টকে নেই" : "অর্ডার নিশ্চিত করুন";

      updateTotal();
    }

    function updateTotal() {
      if (!currentProduct) return;

      const quantity = Math.max(0, Number(quantityInput.value || 0));
      const total = getSellingPrice(currentProduct) * quantity;

      document.getElementById("totalPrice").textContent = money(total);
    }

    quantityInput.addEventListener("input", updateTotal);

    async function loadSingleProduct(id) {
      const snapshot = await getDoc(doc(db, "products", id));

      if (!snapshot.exists()) {
        showStatus("দুঃখিত, এই পণ্যটি পাওয়া যায়নি।", true);
        return;
      }

      showProduct(snapshot.data(), snapshot.id);
    }

    async function loadAllProducts() {
      const snapshot = await getDocs(collection(db, "products"));
      const list = document.getElementById("productList");

      list.innerHTML = "";

      const products = snapshot.docs.map(item => ({
        id: item.id,
        ...item.data()
      }));

      if (products.length === 0) {
        showStatus("এখনো কোনো পণ্য যোগ করা হয়নি।");
        return;
      }

      statusBox.hidden = true;
      allProductsSection.hidden = false;

      products.forEach(product => {
        const card = document.createElement("div");
        card.className = "card";

        const imageHTML = product.image
          ? `<img class="product-image" src="${escapeHTML(product.image)}" alt="পণ্যের ছবি">`
          : "";

        card.innerHTML = `
          ${imageHTML}
          <h3>${escapeHTML(product.productName || "পণ্যের নাম নেই")}</h3>
          <p>পণ্য আইডি: ${escapeHTML(product.productId || product.id)}</p>
          <p>মূল্য: <span class="old-price">${money(product.mrp)}</span></p>
          <p class="price">${money(getSellingPrice(product))}</p>
          <p>স্টকে আছে: ${Number(product.stock || 0)} টি</p>
          <button type="button">পণ্য দেখুন / অর্ডার করুন</button>
        `;

        card.querySelector("button").addEventListener("click", () => {
          const url = new URL(window.location.href);
          url.searchParams.set("id", product.id);
          window.location.href = url.toString();
        });

        list.appendChild(card);
      });
    }

    orderForm.addEventListener("submit", async event => {
      event.preventDefault();

      if (submitting || !currentProduct || !currentDocumentId) return;

      const customerName =
        document.getElementById("customerName").value.trim();

      const phone = document.getElementById("phone").value.trim();

      const address =
        document.getElementById("address").value.trim();

      const quantity = Number(quantityInput.value);
      const unitPrice = getSellingPrice(currentProduct);
      const availableStock = Number(currentProduct.stock || 0);

      if (!customerName || !phone) {
        alert("আপনার নাম ও মোবাইল নম্বর লিখুন।");
        return;
      }

      if (!Number.isSafeInteger(quantity) || quantity < 1) {
        alert("সঠিক পরিমাণ লিখুন।");
        return;
      }

      if (quantity > availableStock) {
        alert("দুঃখিত, পর্যাপ্ত পণ্য স্টকে নেই।");
        return;
      }

      if (!Number.isFinite(unitPrice) || unitPrice < 0) {
        alert("পণ্যের মূল্য সঠিক নয়।");
        return;
      }

      submitting = true;
      orderButton.disabled = true;
      orderButton.textContent = "অর্ডার পাঠানো হচ্ছে...";
      orderMessage.hidden = true;

      try {
        const orderData = {
          productDocumentId: currentDocumentId,
          productId: String(
            currentProduct.productId || currentDocumentId
          ),
          productName: String(currentProduct.productName || ""),
          customerName,
          phone,
          address,
          quantity,
          unitPrice,
          totalPrice: unitPrice * quantity,
          paymentMethod: "offline",
          paymentStatus: "unpaid",
          orderStatus: "pending_confirmation",
          stockDeducted: false,
          createdAt: serverTimestamp()
        };

        const orderRef = await addDoc(
          collection(db, "orders"),
          orderData
        );

        orderMessage.hidden = false;
        orderMessage.className = "message";
        orderMessage.textContent =
          "আপনার অর্ডার গ্রহণ করা হয়েছে। অর্ডার নম্বর: " +
          orderRef.id +
          "। দোকান থেকে নিশ্চিত করার পর অর্ডারটি চূড়ান্ত হবে।";

        orderForm.reset();
        quantityInput.value = "1";
        updateTotal();

      } catch (error) {
        console.error("Order submission failed:", error);

        orderMessage.hidden = false;
        orderMessage.className = "message error";
        orderMessage.textContent =
          "অর্ডার পাঠানো যায়নি। Firebase Rules ও ইন্টারনেট সংযোগ পরীক্ষা করতে হবে।";
      } finally {
        submitting = false;
        orderButton.disabled =
          !currentProduct || Number(currentProduct.stock || 0) < 1;

        orderButton.textContent =
          currentProduct && Number(currentProduct.stock || 0) < 1
            ? "স্টকে নেই"
            : "অর্ডার নিশ্চিত করুন";
      }
    });

    try {
      const params = new URLSearchParams(window.location.search);
      const productId = params.get("id");

      if (productId) {
        await loadSingleProduct(productId);
      } else {
        await loadAllProducts();
      }
    } catch (error) {
      console.error("Product loading failed:", error);
      showStatus(
        "পণ্যের তথ্য লোড করা যায়নি। Firebase সংযোগ ও Rules পরীক্ষা করতে হবে।",
        true
      );
    }
  </script>
</body>
</html>
